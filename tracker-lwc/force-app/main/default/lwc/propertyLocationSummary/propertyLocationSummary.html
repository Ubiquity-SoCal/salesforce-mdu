<template>
    <lightning-card title="Main Property Location" icon-name="standard:location">
        <template lwc:if={hasPL}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <a href={plUrl} class="pl-name">{summary.plName}</a>
                <div class="slds-grid slds-wrap slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-text-title slds-text-color_weak">Opportunities</div>
                        <div class="slds-text-heading_medium slds-m-top_xx-small">{oppCount}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-text-title slds-text-color_weak">Total Units</div>
                        <div class="slds-text-heading_medium slds-m-top_xx-small">{unitCount}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                        <div class="slds-text-title slds-text-color_weak">Active Units</div>
                        <div class="slds-text-heading_medium slds-m-top_xx-small">{activeUnitCount}</div>
                    </div>
                </div>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-text-color_weak">
                No Property Location linked.
            </div>
        </template>
    </lightning-card>
</template>
