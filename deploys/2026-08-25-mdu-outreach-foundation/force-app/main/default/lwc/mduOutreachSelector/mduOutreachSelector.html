<template>
    <lightning-card title="MDU Outreach" icon-name="standard:email">
        <div class="slds-p-horizontal_medium">
            <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input
                        data-filter-city
                        label="City"
                        value={city}
                        onchange={handleCityChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input
                        data-filter-state
                        label="State"
                        value={state}
                        onchange={handleStateChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input
                        data-filter-min-units
                        type="number"
                        label="Minimum units"
                        value={minUnits}
                        onchange={handleMinUnitsChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input
                        data-filter-mine-only
                        type="checkbox"
                        label="Only my opportunities"
                        checked={mineOnly}
                        onchange={handleMineOnlyChange}></lightning-input>
                </div>
            </div>

            <p data-counter class="slds-text-heading_small slds-m-bottom_small">{counterText}</p>

            <table class="slds-table slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col"><div class="slds-truncate">Select</div></th>
                        <th scope="col"><div class="slds-truncate">Property</div></th>
                        <th scope="col"><div class="slds-truncate">Units</div></th>
                        <th scope="col"><div class="slds-truncate">Stage</div></th>
                        <th scope="col"><div class="slds-truncate">Contact</div></th>
                        <th scope="col"><div class="slds-truncate">Email</div></th>
                        <th scope="col"><div class="slds-truncate">Status</div></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr data-row key={row.opportunityId} class="slds-hint-parent">
                            <td>
                                <lightning-input
                                    type="checkbox"
                                    data-id={row.opportunityId}
                                    disabled={row.notSelectable}
                                    onchange={handleToggle}
                                    variant="label-hidden"
                                    label="Select property"></lightning-input>
                            </td>
                            <td><div class="slds-truncate">{row.propertyName}</div></td>
                            <td><div class="slds-truncate">{row.units}</div></td>
                            <td data-cell-stage><div class="slds-truncate">{row.stage}</div></td>
                            <td data-cell-contact><div class="slds-truncate">{row.contactName}</div></td>
                            <td data-cell-email><div class="slds-truncate">{row.contactEmail}</div></td>
                            <td><div class="slds-truncate">{row.chip}</div></td>
                        </tr>
                    </template>
                </tbody>
            </table>

            <lightning-button
                data-preview
                class="slds-m-vertical_small"
                label="Preview this batch"
                disabled={previewDisabled}
                onclick={handleLoadPreviews}></lightning-button>

            <template if:true={previews.length}>
                <h2 class="slds-text-heading_small slds-m-vertical_small">
                    Read all three before confirming
                </h2>
                <template for:each={previews} for:item="item" for:index="i">
                    <div data-preview-item key={item.toAddress} class="slds-box slds-m-bottom_small">
                        <p class="slds-text-body_small">
                            To {item.toAddress}, {item.propertyCount} properties, {item.totalUnits} units
                        </p>
                        <p class="slds-text-heading_x-small">{item.subject}</p>
                        <lightning-formatted-rich-text value={item.bodyHtml}></lightning-formatted-rich-text>
                        <lightning-button
                            data-index={i}
                            label="I have read this one"
                            onclick={handlePreviewSeen}></lightning-button>
                    </div>
                </template>
            </template>

            <lightning-button
                data-confirm
                variant="brand"
                label="Confirm batch"
                disabled={confirmDisabled}
                onclick={handleConfirm}></lightning-button>

            <template if:true={errorMessage}>
                <div data-error class="slds-text-color_error slds-m-top_small">
                    {errorMessage}
                </div>
            </template>

            <!-- One paragraph per channel, never merged. "3 refusals" must not be readable as
                 "3 people got a message with the wrong greeting". -->
            <template if:true={result}>
                <div data-result class="slds-box slds-m-top_small">
                    <p>{result.messageCount} messages written.</p>
                    <template if:true={result.rejectedAddresses.length}>
                        <p>Already contacted, never retry: {result.rejectedAddresses}</p>
                    </template>
                    <template if:true={result.deferredKeys.length}>
                        <p>Not contacted, safe to retry: {result.deferredKeys}</p>
                    </template>
                    <template if:true={result.refusals.length}>
                        <p>Nothing was sent for these: {result.refusals}</p>
                    </template>
                    <template if:true={result.overrideWarnings.length}>
                        <p>Sent, but your contact choice did not apply: {result.overrideWarnings}</p>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
